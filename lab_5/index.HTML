<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internet Technologies and Web Design</title>
</head>
<body>
<form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
    <h1> Volunteer Form</h1>
    <fieldset>
        <legend> My Info </legend>
        <div> 
            <label for="first_name_field">First Name:</label>
            <input type= "text" id="first_name_field" name="first_name_field">
        </div>
         <div> 
            <label for="last_name_field">Last Name:</label>
            <input type= "text" id="last_name_field" name="last_name_field">
        </div>
        <div> 
            <label for="phone_field">Phone:</label>
            <input type= "tel" id="phone_field" name="phone_field">
        </div>
        <div> 
            <label for="email_field">Email:</label>
            <input type= "email" id="email_field" name="email_field">
        </div>
        <div>
            <label for="gender_field" id="gender_label">Gender:</label>
            <br>
            <label for="male"> Male </label>
            <input type="radio" name="gender" value="male">
            <label for="female"> Female </label>
            <input type="radio" name="gender" value="female">
        </div>
        <div>
            <label for="age_field"> Age:</label>
            <select id="age_field" name="age_field">
                <option value="Under 18">Under 18</option>
                <option value="Over 18">Over 18</option>
            </select>
        </div>
    
    </fieldset>

<fieldset>
    <legend> My Availability </legend>
    <h3> Days Avaialable:</h3>
    <input type="checkbox" id="sunday" name="Sunday">
    <label for="sunday"> Sunday</label><br>
    <input type="checkbox" id="monday" name="Monday">
    <label for="monday"> Monday</label><br>
    <input type="checkbox" id="tuesday" name="Tuesday">
    <label for="tuesday"> Tuesday</label><br>
    <input type="checkbox" id="wednesday" name="Wednesday">
    <label for="wednesday"> Wednesday</label><br>
    <input type="checkbox" id="thursday" name="Thursday">
    <label for="thursday"> Thursday</label><br>
    <input type="checkbox" id="friday" name="Friday">
    <label for="friday"> Friday</label><br>
    <input type="checkbox" id="saturday" name="Saturday">
    <label for="saturday"> Saturday</label><br>
    
    <label for="comments">Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="50"></textarea>
</fieldset>

     <input type="hidden" name="hidden_field" value="JuliaBarbosaSolorzano">

<input type="Submit" value="Submit Query"> 
</form>
</body>
</html>
